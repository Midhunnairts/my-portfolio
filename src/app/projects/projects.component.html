<section id="portfolio">
    <div class="container">
        <h2><strong>{{'projects.title' | translate}}</strong></h2>
        <span class="bar-title mb-5"></span>
        
        <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-12 mb-5" data-aos="fade-up" *ngFor="let project of projects;">
                <div class="project-card card h-100">
                    <!-- Project Image Section -->
                    <div class="project-image-container">
                        <div id="{{project.id}}-img" class="project-img" 
                             [ngStyle]="{'backgroundImage':'url('+project.images[0].src+')'}">
                        </div>
                        <div id="{{project.id}}-link" class="project-overlay d-flex align-items-center justify-content-center">
                            <a *ngFor="let image of project.images;let index=index" href="{{image.src}}" data-gall="project.id"
                               class="venobox vbox-item zoom-btn" title="{{image.title}}">
                                <i *ngIf="index==0" class="bx bx-zoom-in"></i>
                            </a>
                        </div>
                    </div>
                    
                    <!-- Project Body Section -->
                    <div class="card-body d-flex flex-column">
                        <h3 class="project-title">{{project.name}}</h3>
                        
                        <!-- Tech Badges -->
                        <div class="tech-tags mt-2 mb-3">
                            <span *ngFor="let tag of project.technologies.split(',')" class="tech-badge">
                                {{tag.trim()}}
                            </span>
                        </div>
                        
                        <!-- Expanded Description -->
                        <div *ngIf="project.detailIsDisplayed" class="project-desc-expanded mt-2 mb-3" [innerHTML]="project.detail">
                        </div>
                        
                        <!-- Actions -->
                        <div class="project-actions mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                            <a href="{{project.codeSourceUrl}}" target="_blank" class="btn btn-outline-primary d-flex align-items-center">
                                <i class="fa fa-github mr-2"></i> {{'projects.sourceCode' | translate}}
                            </a>
                            <button (click)="detailOnClick(project)" type="button" class="btn btn-primary d-flex align-items-center">
                                <span class="mr-1"><i class="bx" [ngClass]="project.detailIsDisplayed ? 'bx-minus' : 'bx-plus'"></i></span>
                                Details
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
