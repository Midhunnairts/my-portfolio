<section id="contact">
    <div class="container mb-5">
        <h2><strong>{{'contact.contactMe' | translate}}</strong></h2>
        <span class="bar-title mb-5"></span>
        
        <div class="row contact-card-wrapper shadow-lg" data-aos="fade-up">
            <!-- Left Info Panel -->
            <div class="col-lg-4 col-md-5 info-panel d-flex flex-column justify-content-between p-5">
                <div>
                    <h3 class="panel-title mb-3">Let's Connect</h3>
                    <p class="panel-subtitle mb-5">{{'contact.notHesitateToContactMe' | translate}}</p>
                    
                    <div class="contact-details">
                        <div class="detail-item d-flex align-items-center mb-4">
                            <span class="detail-icon"><i class="bx bx-envelope"></i></span>
                            <div class="detail-text">
                                <span class="detail-label">Email</span>
                                <a href="mailto:midhunnair217&#64;gmail.com" class="detail-val">midhunnair217&#64;gmail.com</a>
                            </div>
                        </div>
                        <div class="detail-item d-flex align-items-center mb-4">
                            <span class="detail-icon"><i class="bx bx-map"></i></span>
                            <div class="detail-text">
                                <span class="detail-label">Location</span>
                                <span class="detail-val">Bangalore, India</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="social-icons-row d-flex">
                    <a href="https://www.linkedin.com/in/midhun-nair-t-s-b213b7216/" target="_blank" class="social-circle mr-2">
                        <i class="fa fa-linkedin"></i>
                    </a>
                    <a href="https://github.com/midhunnairts" target="_blank" class="social-circle">
                        <i class="fa fa-github"></i>
                    </a>
                </div>
            </div>
            
            <!-- Right Form Panel -->
            <div class="col-lg-8 col-md-7 form-panel p-5">
                <form class="contact-form" [formGroup]="contactForm" (submit)="sendEmail($event)">
                    
                    <!-- Alert Messages -->
                    <div *ngIf="successMessage" class="alert alert-success" role="alert">
                        {{ successMessage }}
                    </div>
                    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                        {{ errorMessage }}
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="identite">{{'contact.identify' | translate}}</label>
                            <input type="text" class="form-control" id="identite" placeholder="{{'contact.enterIdentify' | translate}}" name="identite" formControlName="identite">
                            <div *ngIf="contactForm.get('identite')?.touched && contactForm.get('identite')?.invalid" class="text-danger small mt-1">
                                Name is required.
                            </div>
                        </div>
                        <div class="form-group col-md-6 mt-3 mt-md-0">
                            <label for="email">{{'contact.email' | translate}}</label>
                            <input type="email" class="form-control" id="email" placeholder="{{'contact.enterEmail' | translate}}" name="email" formControlName="email">
                            <div *ngIf="contactForm.get('email')?.touched && contactForm.get('email')?.invalid" class="text-danger small mt-1">
                                Valid email is required.
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group mt-4">
                        <label for="object">{{'contact.object' | translate}}</label>
                        <input type="text" class="form-control" id="object" placeholder="{{'contact.enterObject' | translate}}" name="object" formControlName="object">
                        <div *ngIf="contactForm.get('object')?.touched && contactForm.get('object')?.invalid" class="text-danger small mt-1">
                            Subject is required.
                        </div>
                    </div>
                    
                    <div class="form-group mt-4">
                        <label for="comment">{{'contact.message' | translate}}</label>
                        <textarea class="form-control" rows="5" id="comment" placeholder="Write your message here..." name="comment" formControlName="comment"></textarea>
                        <div *ngIf="contactForm.get('comment')?.touched && contactForm.get('comment')?.invalid" class="text-danger small mt-1">
                            Message is required.
                        </div>
                    </div>
                    
                    <div class="text-right mt-4">
                        <button type="submit" class="btn btn-primary px-5" [disabled]="isSending">
                            <span *ngIf="isSending" class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
                            {{'contact.send' | translate}}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
