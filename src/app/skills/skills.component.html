<section id="skills">
    <div class="container">
        <h2><strong>{{'skills.title' | translate}}</strong></h2>
        <span class="bar-title mb-5"></span>
        
        <div class="row mt-2">
            <!-- Left Side: Technologies -->
            <div class="col-lg-6 mb-4" data-aos="fade-up" data-aos-delay="100">
                <div class="skills-card p-4 h-100">
                    <h5 class="category-title mb-4">
                        <i class='bx bx-code-alt mr-2 icon-accent'></i>
                        <strong>{{'skills.technologies' | translate}}</strong>
                    </h5>
                    <div class="skills-grid">
                        <div class="skill-pill-item" *ngFor="let technologie of skills.technologies;">
                            <i class="bx bx-check-double skill-check-icon mr-2"></i>
                            <span class="skill-item-text">{{technologie.name}}</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Side: Tools -->
            <div class="col-lg-6 mb-4" data-aos="fade-up" data-aos-delay="200">
                <div class="skills-card p-4 h-100">
                    <h5 class="category-title mb-4">
                        <i class='bx bx-wrench mr-2 icon-accent'></i>
                        <strong>{{'skills.tools' | translate}}</strong>
                    </h5>
                    <div class="skills-grid">
                        <div class="skill-pill-item" *ngFor="let tool of skills.tools;">
                            <i class="bx bx-cog skill-check-icon mr-2"></i>
                            <span class="skill-item-text">{{tool.name}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
